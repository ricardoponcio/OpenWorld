<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWorld Dashboard v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.8);
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            padding: 1rem 2rem;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .tabs {
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: 'Outfit';
            font-size: 1rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--text);
            background: rgba(56,189,248,0.1);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        /* Main Area */
        #content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none !important;
            padding: 2rem;
            overflow-y: auto;
            z-index: 1;
        }

        .view.active { display: block !important; z-index: 10; }

        /* Mapa View */
        #map-view.active {
            display: flex !important;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #111827 0%, #080c14 100%);
        }


        #map-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 4px solid #1e293b;
            border-radius: 4px;
        }

        #world-map {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            width: 700px;
            height: 700px;
        }

        .tile { width: 100%; height: 100%; border: 0.1px solid rgba(255,255,255,0.01); }
        .tile-0 { background: #064e3b; } /* Floresta/Grama */
        .tile-1 { background: #1e3a8a; } /* Água */
        .tile-2 { background: #334155; } /* Prédio */
        .tile-3 { background: #065f46; } /* Floresta densa */

        /* Marcadores */
        .npc-marker {
            position: absolute;
            width: 12px; height: 12px;
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            box-shadow: 0 0 15px var(--accent);
        }

        .building-marker {
            position: absolute;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            z-index: 10;
            border-radius: 2px;
        }

        /* Casas */
        .b-home {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Trabalho / Social */
        .b-work {
            background: rgba(56,189,248,0.1);
            border: 1px dashed var(--accent);
        }


        .marker-label {
            position: absolute;
            bottom: 100%; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: 0.2s;
        }
        .npc-marker:hover .marker-label, .building-marker:hover .marker-label { opacity: 1; }

        /* Habitantes View */
        .npc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .npc-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s;
        }

        .npc-card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .status-row { display: flex; gap: 1rem; margin-top: 1rem; }
        .status-item { flex: 1; text-align: center; }
        .status-bar { height: 4px; background: #222; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .status-fill { height: 100%; transition: width 0.5s; }

        /* Crônicas (Sidebar ou Tab) */
        #event-log {
            position: fixed;
            right: 1rem; bottom: 1rem;
            width: 350px; height: 250px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1rem;
            font-size: 0.8rem;
            overflow-y: auto;
            z-index: 1000;
        }
        .event-item { margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Status Bar */
        #status-bar {
            background: rgba(0,0,0,0.5);
            padding: 0.4rem 2rem;
            font-size: 0.75rem;
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s;
        }
        .status-ok { color: var(--success); }
        .status-warn { color: var(--warning); background: rgba(245,158,11,0.1) !important; }
        .status-error { color: var(--danger); background: rgba(239,68,68,0.1) !important; }

    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap: 15px;">
            <h1 style="font-family: 'Outfit'; font-size: 1.5rem;">OpenWorld <small style="opacity:0.5">v4.0</small></h1>
            <div id="clock" style="font-family: 'Outfit'; color: var(--accent); font-weight: bold; background: rgba(56,189,248,0.1); padding: 4px 12px; border-radius: 20px;">
                Sincronizando...
            </div>
            <button id="pause-btn" onclick="togglePause()" style="background: var(--accent); border:none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; box-shadow: 0 0 10px var(--accent);">⏸️</button>
        </div>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchView(this, 'map-view')">🗺️ Mapa</button>
            <button class="tab-btn" onclick="switchView(this, 'npc-view')">👥 Habitantes</button>
        </nav>
    </header>

    <div id="status-bar">
        <span id="status-icon">🟢</span>
        <span id="status-msg">Sistema Online</span>
    </div>


    <div id="content">
        <!-- Mapa View -->
        <div id="map-view" class="view active">
            <div id="map-container">
                <div id="world-map"></div>
                <!-- Marcadores dinâmicos entram aqui -->
            </div>
        </div>

        <!-- NPCs View -->
        <div id="npc-view" class="view">
            <div id="npc-grid" class="npc-grid"></div>
        </div>
    </div>

    <div id="event-log"></div>

    <script>
        let staticData = null;
        let activeView = 'map-view';
        let npcOffsets = {}; // Para empilhamento

        function switchView(btn, id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            activeView = id;
            
            // Forçar atualização imediata ao trocar de aba
            update();
        }


        async function init() {
            try {
                const res = await fetch('/api/init');
                staticData = await res.json();
                
                // Renderizar Terreno
                const mapEl = document.getElementById('world-map');
                mapEl.innerHTML = '';
                staticData.mapa.forEach(row => {
                    row.forEach(tile => {
                        const div = document.createElement('div');
                        div.className = `tile tile-${tile}`;
                        mapEl.appendChild(div);
                    });
                });

                // Renderizar Prédios (Estáticos)
                staticData.locais.forEach(loc => {
                    const b = document.createElement('div');
                    const isHome = loc.tipo === 'Casa';
                    b.className = `building-marker ${isHome ? 'b-home' : 'b-work'}`;
                    b.style.left = `${(loc.coords[0] * 5) + 2.5}%`;
                    b.style.top = `${(loc.coords[1] * 5) + 2.5}%`;
                    b.innerHTML = `<span class="marker-label">${loc.nome}</span>`;
                    document.getElementById('map-container').appendChild(b);
                });


                update();
                setInterval(update, 1000);
            } catch (e) { console.error("Init Error:", e); }
        }

        async function update() {
            const statusMsg = document.getElementById('status-msg');
            const statusIcon = document.getElementById('status-icon');
            const statusBar = document.getElementById('status-bar');

            try {
                const res = await fetch('/api/update');
                const data = await res.json();

                if (data.error) {
                    statusMsg.innerText = data.error;
                    statusIcon.innerText = "🔴";
                    statusBar.className = "status-error";
                    return;
                }

                // Avisos (ex: tabelas faltando)
                if (data.warnings && data.warnings.length > 0) {
                    statusMsg.innerText = "⚠️ " + data.warnings.join(' | ');
                    statusIcon.innerText = "🟡";
                    statusBar.className = "status-warn";
                } else {
                    statusMsg.innerText = "Sistema Online | Sincronizado";
                    statusIcon.innerText = "🟢";
                    statusBar.className = "status-ok";
                }

                updatePauseUI(data.p);

                document.getElementById('clock').innerText = data.h || "Sincronizando...";

                // --- LÓGICA DO MAPA ---
                const mapContainer = document.getElementById('map-container');
                // Só processa marcadores se a aba MAPA estiver ativa
                if (activeView === 'map-view' && data.npcs) {
                    const locationCounts = {};
                    data.npcs.forEach(npc => {
                        let m = document.getElementById(`m-${npc.id}`);
                        if (!m) {
                            m = document.createElement('div');
                            m.id = `m-${npc.id}`;
                            m.className = 'npc-marker';
                            mapContainer.appendChild(m);
                        }
                        m.style.display = 'block'; // Garante que está visível
                        m.innerHTML = `<span class="marker-label">${npc.nome}</span>`;

                        const key = `${npc.coords[0]},${npc.coords[1]}`;
                        locationCounts[key] = (locationCounts[key] || 0) + 1;
                        const offset = (locationCounts[key] - 1) * 6;

                        m.style.left = `calc(${(npc.coords[0] * 5) + 2.5}% + ${offset}px)`;
                        m.style.top = `calc(${(npc.coords[1] * 5) + 2.5}% + ${offset}px)`;
                    });
                } else {
                    // Oculta todos os marcadores se não estiver no mapa
                    document.querySelectorAll('.npc-marker').forEach(m => m.style.display = 'none');
                }


                // Atualizar Cards de NPCs
                if (activeView === 'npc-view' && data.npcs) {
                    const grid = document.getElementById('npc-grid');
                    grid.innerHTML = data.npcs.map(n => `
                        <div class="npc-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                                <h3 style="font-family:'Outfit'">${n.nome}</h3>
                                <span style="font-size:0.7rem; background:rgba(56,189,248,0.1); padding:2px 8px; border-radius:10px; color:var(--accent)">${n.acao}</span>
                            </div>
                            <p style="font-size:0.8rem; color:var(--text-dim); margin-bottom:1rem;">${n.profissao}</p>
                            
                            <div class="status-row">
                                ${renderStatus('⚡', n.status.e, 'var(--accent)')}
                                ${renderStatus('🍗', n.status.f, 'var(--danger)')}
                                ${renderStatus('💬', n.status.s, 'var(--success)')}
                            </div>
                            <div style="margin-top:1rem; font-weight:bold; color:var(--warning)">💰 ${n.status.d}</div>
                        </div>
                    `).join('');
                }

                // Atualizar Eventos
                if (data.evs) {
                    const log = document.getElementById('event-log');
                    log.innerHTML = `<h4 style="margin-bottom:1rem; color:var(--accent)">📜 Crônicas Recentes</h4>` + 
                        data.evs.map(e => `<div class="event-item"><small>${e.t}</small><br>${e.r}</div>`).join('');
                }

            } catch (e) { console.error("Update Error:", e); }
        }


        function renderStatus(icon, val, color) {
            return `
                <div class="status-item">
                    <span style="font-size:0.8rem">${icon}</span>
                    <div class="status-bar"><div class="status-fill" style="width:${val}%; background:${color}"></div></div>
                </div>
            `;
        }

        init();
        async function togglePause() {
            try {
                const res = await fetch('/api/toggle_pause', { method: 'POST' });
                const data = await res.json();
                updatePauseUI(data.pausado);
            } catch (e) { console.error("Pause Error:", e); }
        }

        function updatePauseUI(isPaused) {
            const btn = document.getElementById('pause-btn');
            if (!btn) return;
            btn.innerText = isPaused ? "▶️" : "⏸️";
            btn.style.background = isPaused ? "var(--success)" : "var(--accent)";
            btn.style.boxShadow = `0 0 10px ${isPaused ? "var(--success)" : "var(--accent)"}`;
        }
    </script>
</body>
</html>
